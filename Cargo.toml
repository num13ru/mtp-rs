[workspace]
members = [".", "benchmarks/mtp-rs-vs-libmtp"]

[package]
name = "mtp-rs"
version = "0.16.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Pure-Rust MTP (Media Transfer Protocol) library for modern Android devices"
repository = "https://github.com/vdavid/mtp-rs"
keywords = ["mtp", "android", "usb", "media", "transfer"]
categories = ["hardware-support", "filesystem"]
readme = "README.md"
documentation = "https://docs.rs/mtp-rs"
exclude = [
    ".github/",
    "AGENTS.md",
    "docs/",
    "justfile",
    "deny.toml",
    "clippy.toml",
    "rustfmt.toml",
    "proptest-regressions/",
]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "mtp-rs"
path = "src/bin/mtp-rs.rs"
required-features = ["cli"]

[dependencies]
# USB transport (Phase 3+)
nusb = "0.2"

# Async runtime agnostic
futures = "0.3"
futures-timer = "3.0"
async-trait = "0.1"

# Byte handling
bytes = "1.5"

# Filesystem watching for virtual device
notify = { version = "8", optional = true }

# For thiserror derive
thiserror = "2"

# Enum conversion derives
num_enum = "0.7"

# CLI
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
proptest = "1"
serial_test = "3.1"
parking_lot = "0.12"  # Used by MockTransport
tempfile = "3"

[features]
default = []
cli = ["clap", "serde", "serde_json", "tokio"]
virtual-device = ["notify"]
